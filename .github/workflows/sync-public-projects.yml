name: Sync public projects

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/sync-public-projects.yml
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update project list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const start = '<!-- ALL_PROJECTS:START -->';
            const end = '<!-- ALL_PROJECTS:END -->';
            const featured = new Set([
              'embodied-agent-runtime',
              'RoboTraceOpt',
              'quard-star-riscv64-net',
              'ros2-control-vcan-motor-demo',
            ]);

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: context.repo.owner,
                type: 'owner',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
              },
            );

            const projects = repos
              .filter((repo) => repo.visibility === 'public')
              .filter((repo) => repo.name !== context.repo.repo)
              .filter((repo) => !featured.has(repo.name))
              .map((repo) => {
                const description = (repo.description || '')
                  .replace(/\s+/g, ' ')
                  .trim();
                const language = repo.language ? ` · \`${repo.language}\`` : '';
                const summary = description ? `  \n  ${description}` : '';
                return `- [${repo.name}](${repo.html_url})${language}${summary}`;
              });

            const block = [
              start,
              projects.length ? projects.join('\n') : '- 暂无其他公开项目',
              end,
            ].join('\n');

            const readme = fs.readFileSync('README.md', 'utf8');
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
            if (!pattern.test(readme)) {
              core.setFailed('README.md does not contain the project list markers.');
              return;
            }

            const updated = readme.replace(pattern, block);
            if (updated !== readme) {
              fs.writeFileSync('README.md', updated);
            }

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Project list is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync public project list"
          git push
