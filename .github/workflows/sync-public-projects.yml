name: Sync public projects

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/sync-public-projects.yml
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Update project list
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const start = '<!-- ALL_PROJECTS:START -->';
            const end = '<!-- ALL_PROJECTS:END -->';
            const coreProjects = new Set([
              'embodied-agent-runtime',
              'RoboTraceOpt',
              'quard-star-riscv64-net',
              'workbench-desk-robot',
            ]);
            const excludedProjects = new Set([
              'FuckJob-fix-backup',
            ]);
            const projectStacks = new Map([
              ['Quchaosheng.github.io', ['HTML', 'CSS', 'JavaScript', 'GitHub Pages']],
              ['ros2-control-vcan-motor-demo', ['C++17', 'ROS 2 Humble', 'ros2_control', 'SocketCAN', 'launch_testing']],
              ['ros2-apriltag-docking-demo', ['Python 3', 'ROS 2 Jazzy', 'Nav2 Docking', 'AprilTag', 'Gazebo Harmonic']],
            ]);

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: context.repo.owner,
                type: 'owner',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
              },
            );

            const escapeHtml = (value) => value
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');

            const getProjectStack = async (repo) => {
              const curatedStack = projectStacks.get(repo.name);
              if (curatedStack) {
                return curatedStack;
              }

              const { data: languages } = await github.rest.repos.listLanguages({
                owner: context.repo.owner,
                repo: repo.name,
              });
              const detectedLanguages = Object.entries(languages)
                .sort(([, leftBytes], [, rightBytes]) => rightBytes - leftBytes)
                .slice(0, 4)
                .map(([language]) => language);
              return detectedLanguages.length
                ? detectedLanguages
                : [repo.language || '未标注'];
            };

            const visibleRepos = repos
              .filter((repo) => repo.visibility === 'public')
              .filter((repo) => !repo.archived && !repo.fork)
              .filter((repo) => repo.name !== context.repo.repo)
              .filter((repo) => !coreProjects.has(repo.name))
              .filter((repo) => !excludedProjects.has(repo.name));

            const projects = await Promise.all(
              visibleRepos.map(async (repo) => {
                const description = (repo.description || '')
                  .replace(/\s+/g, ' ')
                  .trim();
                const summary = description || '暂无仓库简介。';
                const stack = await getProjectStack(repo);
                const stackMarkup = stack
                  .map((item) => `<code>${escapeHtml(item)}</code>`)
                  .join(' · ');
                return [
                  '<details>',
                  `<summary><a href="${repo.html_url}"><strong>${escapeHtml(repo.name)}</strong></a></summary>`,
                  `<br>${escapeHtml(summary)}<br>`,
                  stackMarkup,
                  '</details>',
                ].join('\n');
              }),
            );

            const block = [
              start,
              projects.length ? projects.join('\n\n') : '<p>暂无其他公开项目</p>',
              end,
            ].join('\n');

            const readme = fs.readFileSync('README.md', 'utf8');
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
            if (!pattern.test(readme)) {
              core.setFailed('README.md does not contain the project list markers.');
              return;
            }

            const updated = readme.replace(pattern, block);
            if (updated !== readme) {
              fs.writeFileSync('README.md', updated);
            }

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Project list is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync public project list"
          git push
